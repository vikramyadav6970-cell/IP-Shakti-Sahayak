# Curated Ayurvedic & Indian Medicinal Herb Lookup Table
# Maps common, Sanskrit, and vernacular names to official botanical binomials.
# Source: Ayurvedic Pharmacopoeia of India (API) & Botanical Survey of India (BSI).

